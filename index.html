function prepareChatPayment(text){
 const v=text.toLowerCase();if(!/\b(?:send|pay|transfer)\b/.test(v))return null;
 const match=text.match(/(?:₦|ngn\s*)\s*([0-9][0-9,]*)/i);
 if(!match)return null;
 const amt=Number(match[1].replace(/,/g,''));if(!safe(amt)||amt===0)return null;
 const source=keys.find(k=>new RegExp('\\b'+k+'\\b','i').test(text))|| (v.includes('business funding')?'businessFund':null);
 if(!source)return null;
 const candidates=recipientOptions(source);
 const found=candidates.find(c=>v.includes(c.name.toLowerCase()))||candidates.find(c=>c.bank&&v.includes('to '+c.bank.toLowerCase()));
 if(!found)return null;
 if(s.payments.some(p=>['prepared','authorized'].includes(p.status)))return 'You already have a pending payment that must be resolved first.';
 if(amt>available(source))return 'That amount exceeds the available '+labels[source]+' budget. I cannot prepare it for payment.';
 if(!found.verified)return 'The selected beneficiary has not been verified; I cannot prepare the instruction.';
 s.paymentEditor={source,recipient:found.id,amount:String(amt),purpose:'Please confirm payment purpose',reserveAck:false};
 s.preparedFromChat=true;
 return 'I have prefilled a '+fmt(amt)+' '+labels[source]+' payment to '+found.name+' for your review in Payments. It has NOT been authorized or sent. Check the recipient and purpose, then authorize it separately.';
}
function chatResponse(t){const v=t.toLowerCase();
 if(/review.*incoming|new (?:payment|deposit)|bookkeep|record.*payment|how should i record/.test(v)){const rows=unreadCredits();if(!rows.length)return 'There are no unreviewed confirmed incoming payments. You can view the complete receipts list in Overview. When new money arrives, I will ask what it was for and help plan it without automatically moving it.';const r=rows[rows.length-1];return fmt(unreviewedTotal())+' in '+rows.length+' newly confirmed payment(s) needs a bookkeeping purpose. The latest is '+fmt(r.amount)+' from '+r.sender+' ('+r.ref+'). What was this payment for? Was it personal income, a reimbursement, a gift, or money on behalf of someone else? I can recommend a plan once ownership is verified, but cannot determine ownership from your answer alone. You can save a purpose note in Overview.';}
 if(/how will i receive|receiving account|share.*account.*detail/.test(v))return 'The Receive button opens a reusable account-details modal, and the Overview balance card includes a direct copy action. Verified account details will appear only when a payment provider issues them. Senders can transfer any amount without notifying this app first. A signed bank feed will update the wallet; the Accountant will then ask you about the payment for bookkeeping and budgeting. No real account has been issued in this demo.';
 const prepared=prepareChatPayment(t);if(prepared)return prepared;

 if(/summarize this account|recent activity|transactions in this account|can i pay from this account/.test(v)&&s.page==='accounts'&&s.activeAccount){const a=linked(s.activeAccount);if(a){if(/can i pay/.test(v))return 'This linked account is read-only in The Accountant. Even if you have bank access, company payments must be made under the bank’s authorized signatory rules, not from this chat. You can send your own wallet funds to an eligible account using Payments.';const latest=a.transactions.slice(0,3).map(x=>x.name+' ('+(x.direction==='in'?'+':'−')+fmt(x.amount)+')').join('; ');return a.name+' shows a fictional balance of '+fmt(a.balance)+'. Recent sample activity: '+(latest||'no transactions recorded')+'. These are demonstration feed entries, not real banking data.';}}
 if(/summarize linked accounts|how do i link|linked accounts/.test(v))return 'You have '+s.accounts.length+' sample account profiles ('+s.accounts.filter(a=>a.type==='personal').length+' personal and '+s.accounts.filter(a=>a.type==='business').length+' business). Open any in Accounts for sample transactions. Real transaction monitoring requires each bank’s integration and the account owner’s permission.';
 if(/summarize my wallet|wallet summary|wallet balance/.test(v))return 'Wallet cash is '+fmt(cash())+'. Approved budgets currently available to spend: '+fmt(availableTotal())+'. Eligible but unallocated personal income: '+fmt(Math.max(0,eligibleUnassigned()))+'. Unverified receipts restricted: '+fmt(unresolvedTotal())+'. These are simulated ledger figures.';
 if(/review my budget|what can i spend|how much.*available|can i afford/.test(v))return s.plan?'Your available approved budget totals '+fmt(availableTotal())+': '+keys.map(k=>labels[k]+' '+fmt(available(k))).join('; ')+'. A prepared payment also reserves its amount. Check the exact destination and amount under Payments before you approve a transfer.':'There is no approved spending plan yet. Confirm a personal-income receipt, then review an allocation in My Plan. Unverified credits cannot be spent.';
 if(/help.*(?:payment|transfer)|explain payment controls|make a (?:personal )?transfer|send money/.test(v))return 'I can help you prepare, but I cannot send money from this chat. Open Payments to choose the approved budget, beneficiary, amount and reason. Then review and authorize the exact instruction; wallet cash only changes after simulated provider settlement.';

 if(/plan|budget|allocat|split/.test(v)){
  if(!verified())return 'There is no confirmed personal income available to allocate yet. An unverified receipt remains restricted.';
  const total=verifiedTotal(),suggestion=suggestedPlan(total);s.chatDraft=suggestion;
  return 'For your '+fmt(total)+' of demo-verified personal income, here is a starting point: '+keys.map(k=>labels[k]+' '+fmt(suggestion[k])).join('; ')+'. It is only a suggestion. Open My Plan to review or change it. Any existing spending commitments remain protected.';
 }
 if(/business|quickfleet|gallery/.test(v))return 'Business funding is a purpose within your personal plan, not an internal company wallet. Choose any eligible owned-business account or verified owned-business beneficiary in Payments; company bank accounts remain read-only.';
 if(/account|connect|link|bank/.test(v))return 'Accounts contains all personal and business accounts in one directory. Account activity is visible only if access is authorized and a bank provides a feed. This demo contains fictional examples only.';
 if(/pay|send|transfer|allowance/.test(v))return 'Payments lets you choose a purpose, account or beneficiary, and amount. Your budget and payment authorization are checked separately. Repeating allowances need a specific standing mandate.';
 return 'I can discuss your financial position and propose budgets. I cannot approve company withdrawals, authenticate bank feeds, or override spending limits. This conversation is scripted, not live AI.';
}
function chatPage(){return `${panelTitle('AI Accountant','Ask a question or request a plan. Banking controls remain available separately.')}<section class="card fade">${unreadCredits().length?`<div class="assistantCreditReminder"><strong>New incoming money:</strong> ${fmt(unreviewedTotal())} received and awaiting your bookkeeping review. Want to discuss it?<div><button data-prompt="Review my incoming payments">Review incoming money</button><button data-act="goBookkeeping">Record purpose manually</button></div></div>`:''}<div class="notice">This is a <strong>scripted demo conversation</strong>, not a live AI or licensed accountant. Financial rules are enforced outside the conversation.</div><div class="chips">${['Review my budget','Can I fund my business?','How do linked accounts work?','Help me make a personal transfer'].map(t=>`<button data-prompt="${esc(t)}">${esc(t)}</button>`).join('')}</div><div class="chatArea" id="chatArea">${chatMessages()}</div><form class="chatComposer" id="chatForm"><label for="chatText" class="srOnly">Message your Accountant</label><textarea id="chatText" rows="2" placeholder="Ask your Accountant about your money…"></textarea><button class="btn" type="submit">Send</button></form>${s.preparedFromChat?`<div class="draftCard"><strong>Payment instruction prefilled</strong><p class="hint">Nothing has been sent. Review and authorize it in Payments.</p><button class="btn" data-act="reviewChatPayment">Review drafted payment</button></div>`:''}${s.chatDraft?`<div class="draftCard"><strong>Suggested plan ready</strong><p class="hint">You still approve every allocation yourself.</p><button class="btn" data-act="loadChatPlan">Review suggested plan</button></div>`:''}</section>`;}
function sidebar(){
 const active=keys.filter(k=>s.plan?.[k]>0);
 return `<section class="card sidebarCard"><div class="sublabel">Budget remaining</div>${active.length?active.map(k=>kv(labels[k],fmt(available(k)))).join(''):'<p class="hint">No budget yet. Create one in My Plan.</p>'}<div class="actions"><button class="btn line" data-nav="plan">${s.plan?'Edit plan':'Create plan'}</button></div></section>
 <section class="card sidebarCard"><div class="sublabel">Accounts</div>${kv('Personal',String(s.accounts.filter(x=>x.type==='personal').length))}${kv('Business',String(s.accounts.filter(x=>x.type==='business').length))}<div class="actions"><button class="btn line" data-nav="accounts">View accounts</button></div><p class="hint">Illustrative records only · No live bank feeds</p></section>`;
}
function render(){el('app').innerHTML=`<div class="wrap">${header()}<div class="layout"><div class="mainCol">${s.page==='overview'?overviewPage():s.page==='plan'?planPage():s.page==='payments'?paymentsPage():s.page==='accounts'?accountsPage():chatPage()}${s.feedback?`<div class="${s.feedback.kind==='error'?'errorBox':'successBox'}" role="${s.feedback.kind==='error'?'alert':'status'}" aria-live="polite">${esc(s.feedback.text)}</div>`:''}</div><aside class="sideCol">${sidebar()}</aside></div><footer class="footer">The Accountant · v3.0 overview & quick receive · Fictional balances and activity · No real bank, AI, or payment integration</footer></div>${assistantWidget()}${receiveModal()}`;document.body.classList.toggle('assistantOpen',(s.chatOpen&&s.page!=='chat')||s.showReceiveModal);if(s.page==='payments'&&!unsettled())refreshRecipientOptions();if(s.page==='chat'){const a=el('chatArea');if(a)a.scrollTop=a.scrollHeight;}if(s.chatOpen){const a=el('quickChatHistory');if(a)a.scrollTop=a.scrollHeight;}}
function refreshRecipientOptions(){const budget=val('payBudget');const recipient=el('payTo');if(!recipient)return;const candidates=recipientOptions(budget);recipient.innerHTML=candidates.length?candidates.map(x=>`<option value="${esc(x.id)}" ${s.paymentEditor.recipient===x.id?'selected':''}>${esc(x.name)} · ${esc(x.bank)} ••••${esc(x.last4)}${x.verified?'':' (pending verification)'}</option>`).join(''):'<option value="">No eligible recipients; add a beneficiary or linked account</option>';s.paymentEditor.recipient=recipient.value;const r=el('reserveWrap');if(r)r.style.display=['emergency','savings','investments'].includes(budget)?'block':'none';const note=el('paymentRule');if(note)note.textContent=budget==='businessFund'?'Business funding goes from your wallet to an owned business account or saved business beneficiary; it is not a virtual company wallet.':'Personal payments can go to your linked personal accounts or validated external beneficiaries, including business merchants. They cannot debit a company account.';}
function verifyPaymentRecipient(id,source){
 const [kind,ref]=id.split(':');
 if(!['account','beneficiary'].includes(kind)||!ref)throw Error('Select a valid destination.');
 const x=kind==='account'?linked(ref):s.beneficiaries.find(b=>b.id===ref);
 if(!x)throw Error('Unknown recipient.');
 if(source==='businessFund'){
   if(x.type!=='business'||(kind==='account'?!x.owned:!x.fundingOwned))throw Error('Business funding is reserved for an owned business destination. Ordinary business merchants belong in personal payments.');
 }else{
   if(kind==='account'&&x.type!=='personal')throw Error('Personal-budget payments cannot be routed to a linked company account. Use Business funding.');
   if(kind==='beneficiary'&&x.fundingOwned)throw Error('A saved owned business must be paid from Business funding, not a personal living budget.');
 }
 if(kind==='account'&&!x.connected)throw Error('Account profile is pending; a verified provider connection or beneficiary validation is required.');
 if(kind==='beneficiary'&&!x.verified)throw Error('This beneficiary is awaiting verification.');
 return x;
}
function makePayment(source,amount,recipientId,purpose,status='prepared'){if(!verified()||!s.plan)throw Error('Confirm personally owned money and approve a budget before spending.');if(unsettled())throw Error('Complete or cancel the pending transfer first.');if(!safe(amount)||amount===0)throw Error('Amount must be a positive whole-naira value.');if(amount>available(source))throw Error('Amount exceeds the available '+labels[source]+' allocation of '+fmt(available(source))+'.');if(amount>cash()-s.payments.filter(p=>reservedStatuses.includes(p.status)).reduce((v,p)=>v+p.amount,0))throw Error('Not enough unreserved wallet cash.');if(purpose.trim().length<4)throw Error('Please add a meaningful payment purpose.');const recipient=verifyPaymentRecipient(recipientId,source);const p={ref:'DEMO-OUT-'+String(s.payments.length+1).padStart(4,'0'),source,amount,recipientId,recipient:recipient.name,bank:recipient.bank,last4:recipient.last4,purpose,status};s.payments.push(p);log('Transfer '+(status==='authorized'?'initiated by standing rule':'drafted'),fmt(amount)+' from '+labels[source]+' to '+recipient.name+'.');return p;}
function act(key){try{s.feedback=null;switch(key){
case'openReceiveModal':s.showReceiveModal=true;s.chatOpen=false;break;
 case'closeReceiveModal':s.showReceiveModal=false;break;
 case'copyWalletDetails':void copyDemoAccountDetails();break;
 case'reviewCreditWithAI':s.chatOpen=true;s.chat.push({who:'ai',context:'BOOKKEEPING',text:chatResponse('Review my incoming payments')});break;
case'goBookkeeping':s.chatOpen=false;s.page='overview';s.showBookkeeping=true;break;
case'showBookkeeping':s.showBookkeeping=!s.showBookkeeping;break;
case'saveBookkeeping':{const ref=val('bookkeepingRef');const r=s.receipts.find(x=>x.ref===ref&&x.status==='confirmed');const note=val('bookkeepingNote').trim();if(!r||note.length<8)throw Error('Select a confirmed deposit and enter a meaningful purpose of at least eight characters.');r.bookkeepingNote=note;r.bookkeepingReviewed=true;s.showBookkeeping=unreadCredits().length>0;log('Bookkeeping purpose recorded',r.ref+' · '+note+' (ownership unchanged).');feedback('Payment purpose noted. This did not verify ownership, allocate, or authorize any spending.');break;}
case'reviewChatPayment':s.chatOpen=false;s.page='payments';break;
case'openAssistant':s.chatOpen=true;break;
case'closeAssistant':s.chatOpen=false;break;
case'openFullChat':s.chatOpen=false;s.page='chat';break;
case'assistantOpenPayments':s.chatOpen=false;s.page='payments';break;
case'reset':s=initial();break;
case'newReceipt':if(s.receipt?.status==='pending')throw Error('Confirm the pending provider credit first.');s.receipt=null;s.page='overview';s.showDemoReceive=true;feedback('Ready for another sample provider credit.');break;
case'receive':{let amount=num('receiveAmount'),sender=val('receiveFrom').trim();if(!safe(amount)||amount===0||!sender)throw Error('Enter a positive incoming amount and sender.');if(s.receipt?.status==='pending')throw Error('Finish the pending credit first.');if(!Number.isSafeInteger(confirmedTotal()+amount))throw Error('Amount would exceed the safe ledger numeric limit.');const r={amount,sender,provenance:val('receiptType'),status:'pending',bookkeepingReviewed:false,ref:'DEMO-IN-'+String(s.receipts.length+1).padStart(4,'0')};s.receipt=r;s.receipts.push(r);if(!s.plan&&s.receipts.length===1)s.editor={...defaultPlan()};log('Incoming payment detected',fmt(amount)+' from '+sender+' awaiting provider confirmation.');feedback('Awaiting fictional provider confirmation.');break;}
case'confirmReceipt':{if(s.receipt?.status!=='pending')throw Error('No pending receipt.');s.receipt.status='confirmed';s.receipt.bookkeepingReviewed=false;s.chat.push({who:'ai',context:'NEW CREDIT',text:'A new '+fmt(s.receipt.amount)+' credit from '+s.receipt.sender+' ('+s.receipt.ref+') has arrived in your wallet. What was it for? I can help you record its purpose and, once ownership is verified, propose a plan. No allocation or payment has been made.'});if(!s.plan&&s.receipt.provenance==='personal_fixture')s.editor=suggestedPlan(verifiedTotal());log('Wallet credit confirmed',fmt(s.receipt.amount)+' reflected in wallet, unassigned.');feedback('Wallet cash updated; only individually verified personal receipts can be planned or spent.');break;}
case'approvePlan':{if(!verified())throw Error('Receipt ownership not verified in this demo.');let next={};for(const k of keys){const n=num('plan_'+k);if(!safe(n))throw Error('Each allocation must be a non-negative whole-naira amount.');next[k]=n;}if(keys.reduce((v,k)=>v+next[k],0)>verifiedTotal())throw Error('Budget exceeds wallet income.');for(const k of keys)if(next[k]<paidFor(k)+heldFor(k))throw Error(labels[k]+' cannot be less than already committed or paid amounts.');s.plan=next;s.editor={...next};s.editPlan=false;log('Financial budget approved','Your allocation totals '+fmt(plannedTotal())+'. No bank transfer made.');feedback('Budget approved. Use Payments to send money to any eligible account or beneficiary.');break;}
case'editPlan':s.editor={...s.plan};s.editPlan=true;break;
case'cancelEdit':s.editPlan=false;break;
case'loadChatPlan':if(!s.chatDraft)throw Error('No pending suggestion.');s.editor={...s.chatDraft};s.editPlan=!!s.plan;s.page='plan';break;
case'toggleActivity':s.showAllActivity=!s.showAllActivity;break;
case'toggleBalanceDetails':s.showBalanceDetails=!s.showBalanceDetails;break;
case'preparePayment':{const source=val('payBudget'),amount=num('payAmount'),id=val('payTo'),purpose=val('payPurpose');if(!keys.includes(source))throw Error('Select a budget.');if(['emergency','savings','investments'].includes(source)&&!el('reserveAck')?.checked)throw Error('This spending is from a protected reserve. Explicitly acknowledge it.');makePayment(source,amount,id,purpose);s.preparedFromChat=false;s.paymentEditor={source:'essentials',recipient:'account:kuda',amount:'25000',purpose:'Personal living expense',reserveAck:false};feedback('Review your beneficiary and authorize the drafted payment.');break;}
case'authorizePayment':{let p=unsettled();if(p?.status!=='prepared')throw Error('No draft awaiting authorization.');if(!el('paymentConsent')?.checked)throw Error('Confirm the exact amount and recipient before authorizing.');p.status='authorized';log('Transfer authorized',p.ref+' · '+fmt(p.amount)+' waiting for bank confirmation.');feedback('Authorized in simulation. The cash balance is unchanged until settlement.');break;}
case'cancelPayment':{let p=unsettled();if(p?.status!=='prepared')throw Error('Only a draft can be cancelled.');p.status='cancelled';log('Draft cancelled',p.ref+' released its budget reservation.');break;}
case'settlePayment':{let p=unsettled();if(p?.status!=='authorized')throw Error('No authorized payout awaiting bank confirmation.');p.status='settled';if(p.recipientId.startsWith('account:'))s.linkedCredits.push({ref:p.ref,accountId:p.recipientId.slice(8),amount:p.amount,purpose:p.purpose,status:'pending'});log('Provider payout confirmed',fmt(p.amount)+' sent to '+p.recipient+' · '+p.ref+'.');feedback('Fictional provider confirmed settlement; wallet cash reduced by '+fmt(p.amount)+'.');break;}
case'failPayment':{let p=unsettled();if(p?.status!=='authorized')throw Error('No authorized transfer to fail.');p.status='failed';log('Payout failed',p.ref+' · wallet unchanged and budget released.');feedback('Payout failed; money remained in your wallet.');break;}
case'toggleConnect':s.showConnect=!s.showConnect;break;
case'addAccount':{let type=val('linkType'),name=val('linkName').trim(),bank=val('linkBank').trim(),last4=val('linkLast4').trim();if(!el('linkConsent')?.checked)throw Error('Confirm access authority.');if(!['personal','business'].includes(type)||name.length<3||bank.length<2||!/^[0-9]{4}$/.test(last4))throw Error('Enter account type, name, bank and four numeric ending digits.');let a={id:'custom-'+(s.accounts.length+1),name,bank,last4,type,owned:type==='personal'?true:!!el('linkOwned')?.checked,connected:false,balance:0,transactions:[]};s.accounts.push(a);s.showConnect=false;log('Account profile saved',name+' · '+type+' · awaiting bank connection and consent.');feedback('Account saved as a sample profile; it is not linked to a real bank.');break;}
case'backAccounts':s.activeAccount=null;s.accountFilter='all';break;
case'showBeneficiaries':s.showBeneficiary=true;break;
case'hideBeneficiaries':s.showBeneficiary=false;break;
case'openBeneficiaries':s.page='payments';s.showBeneficiary=true;break;
case'addBeneficiary':{const type=val('beneficiaryType'),name=val('beneficiaryName').trim(),bank=val('beneficiaryBank').trim(),last4=val('beneficiaryLast4').trim();if(!['personal','business'].includes(type)||name.length<3||bank.length<2||!/^[0-9]{4}$/.test(last4))throw Error('Enter a beneficiary name, bank, type and four-digit ending.');const fundingOwned=type==='business'&&!!el('beneficiaryOwned')?.checked;s.beneficiaries.push({id:'new-'+(s.beneficiaries.length+1),name,bank,last4,type,verified:false,fundingOwned});log('Beneficiary created',name+' · bank verification still pending.');feedback('Saved beneficiary, but real payments remain unavailable until verification.');break;}
case'showStanding':s.showStanding=true;break;
case'hideStanding':s.showStanding=false;break;
case'saveStanding':{let accountId=val('standingAccount'),source=val('standingSource'),amount=num('standingAmount'),cadence=val('standingCadence'),a=linked(accountId);if(!a||a.type!=='personal'||!a.connected)throw Error('Select a demo-connected personal account (real linking not available).');if(!['essentials','flexible'].includes(source)||!['daily','weekly','monthly'].includes(cadence)||!safe(amount)||amount===0)throw Error('Invalid standing payment rule.');if(!verified()||!s.plan||amount>available(source))throw Error('This allowance exceeds your approved available budget.');if(!el('standingConsent')?.checked)throw Error('You must explicitly authorize the recurring limit.');s.standing={accountId,source,amount,cadence,active:true,lastPeriod:null};s.showStanding=false;log('Allowance rule saved',fmt(amount)+' '+cadence+' to '+a.name+' · demo only.');feedback('Saved a fictional standing authorization; no background banking scheduler is active.');break;}
case'toggleStanding':if(!s.standing)throw Error('No standing instruction.');s.standing.active=!s.standing.active;break;
case'cancelStanding':s.standing=null;log('Allowance cancelled','Future simulated payments cancelled.');break;
case'simulateStanding':{let z=s.standing;if(!z?.active)throw Error('No active allowance instruction.');const d=new Date();const day=d.toLocaleDateString('en-CA');const start=new Date(d.getFullYear(),0,1);const wk=Math.ceil(((d-start)/86400000+start.getDay()+1)/7);const period=z.cadence==='monthly'?d.getFullYear()+'-'+(d.getMonth()+1):z.cadence==='weekly'?d.getFullYear()+'-W'+wk:day;if(z.lastPeriod===period)throw Error('This '+z.cadence+' allowance has already run for the current period.');const p=makePayment(z.source,z.amount,'account:'+z.accountId,'Standing '+z.cadence+' living allowance','authorized');z.lastPeriod=period;log('Allowance payment due',p.ref+' created under demo standing mandate.');feedback('Scheduled payout prepared under your standing instruction. Await simulated bank settlement.');break;}
default:throw Error('Unknown action.');}}
catch(e){feedback(e.message||'Could not complete request.','error');}render();if(key==='openAssistant')el('chatTextQuick')?.focus();if(key==='openReceiveModal')document.querySelector('.receiveModalClose')?.focus();if(key==='closeReceiveModal')document.querySelector('[data-act="openReceiveModal"]')?.focus();if(key==='closeAssistant')document.querySelector('.assistantLauncher')?.focus();}
document.addEventListener('click',e=>{let n=e.target.closest('[data-account]');if(n){s.activeAccount=n.dataset.account;s.accountFilter='all';s.page='accounts';s.feedback=null;render();return;}n=e.target.closest('[data-filter]');if(n){s.accountFilter=n.dataset.filter;render();return;}n=e.target.closest('[data-confirm-credit]');if(n){const c=s.linkedCredits.find(x=>x.ref===n.dataset.confirmCredit);if(c?.status==='pending'){c.status='confirmed';log('Linked account demo credit confirmed',c.ref+' · '+fmt(c.amount)+' shown in fictional bank activity.');feedback('The separate fictional account feed now reflects the credit.');}else feedback('Credit already confirmed or not found.','error');render();return;}n=e.target.closest('[data-verify-ben]');if(n){let b=s.beneficiaries.find(x=>x.id===n.dataset.verifyBen);if(b){b.verified=true;log('Sample beneficiary verified',b.name+' · fictional verification fixture, not actual bank validation.');feedback('Fictional verification completed.');render();}return;}n=e.target.closest('[data-nav]');if(n){s.page=n.dataset.nav;if(s.page==='chat')s.chatOpen=false;s.feedback=null;if(s.page==='accounts'){s.activeAccount=null;s.accountFilter='all';}render();return;}n=e.target.closest('[data-act]');if(n){act(n.dataset.act);return;}n=e.target.closest('[data-prompt]');if(n){talk(n.dataset.prompt);return;}});
document.addEventListener('change',e=>{if(e.target.id==='payBudget'){s.paymentEditor.source=e.target.value;s.paymentEditor.recipient='';s.paymentEditor.reserveAck=false;refreshRecipientOptions();const chk=el('reserveAck');if(chk)chk.checked=false;}if(e.target.id==='payTo')s.paymentEditor.recipient=e.target.value;if(e.target.id==='reserveAck')s.paymentEditor.reserveAck=e.target.checked;if(e.target.id==='linkType'){const o=el('linkOwned');if(o)o.checked=e.target.value==='personal';}});
document.addEventListener('input',e=>{if(e.target.id==='payAmount')s.paymentEditor.amount=e.target.value;if(e.target.id==='payPurpose')s.paymentEditor.purpose=e.target.value;if(e.target.id.startsWith('plan_')){const k=e.target.id.slice(5);if(keys.includes(k)){s.editor[k]=Number(e.target.value||0);let total=keys.reduce((v,j)=>v+(safe(s.editor[j])?s.editor[j]:0),0);if(el('planTotal'))el('planTotal').textContent=fmt(total);if(el('planLeft'))el('planLeft').textContent=fmt(verifiedTotal()-total);}}});
function talk(t){const text=(t||'').trim();if(!text)return;const ctx=currentAssistantContext();s.chat.push({who:'you',text,context:ctx.tag});s.chat.push({who:'ai',text:chatResponse(text),context:ctx.tag});s.feedback=null;render();if(s.chatOpen)el('chatTextQuick')?.focus();} 
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();talk(val('chatText'));}else if(e.target.id==='quickChatForm'){e.preventDefault();talk(val('chatTextQuick'));}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.showReceiveModal){s.showReceiveModal=false;render();document.querySelector('[data-act="openReceiveModal"]')?.focus();return;}if(e.key==='Escape'&&s.chatOpen){s.chatOpen=false;render();document.querySelector('.assistantLauncher')?.focus();}});

render();
})();
</script></body></html>
